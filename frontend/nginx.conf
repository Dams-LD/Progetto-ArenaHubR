server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Applicazione Angular a pagina singola: qualunque indirizzo che non è un file
    # riporta a index.html, così il ricaricamento della pagina non dà errore 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html non va tenuto in cache: ad ogni nuova versione punta a file nuovi
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # I file js e css di Angular hanno il codice nel nome: si possono tenere a lungo
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
