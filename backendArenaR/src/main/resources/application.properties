spring.application.name=backendArena

#Dice a Spring di caricare anche application-local.properties dove stanno le credenziali che non vanno su git
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=validate
#validate, none era per test^
spring.jpa.open-in-view=false

# Verifica dei token Supabase
#Il primo dice da chi devono provenire i token accettati, il secondo dove scaricare le chiavi
# pubbliche per verificarne la firma.
# Spring le scarica una volta e le tiene in memoria.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://zmbbqspsnqakmzhgqicb.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://zmbbqspsnqakmzhgqicb.supabase.co/auth/v1/.well-known/jwks.json

# Supabase firma i token con ES256 (chiavi asimmetriche). Spring di default accetta solo RS256.
# Verificare il campo "alg" nell header del token prima di toccare questa riga.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256,RS256
